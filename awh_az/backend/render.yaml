services:
  - type: web
    name: awh-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Base64-encoded Firebase service account JSON
      # To encode: base64 -i serviceAccountKey.json | tr -d '\n'
      # Then paste the result as the value on the Render dashboard
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

      # Read key for every data endpoint (generate: openssl rand -hex 32). The
      # dashboard's BACKEND_API_KEY must hold the same value. While unset the API
      # is publicly readable and logs a warning at startup.
      - key: API_KEY
        sync: false
      # Gates /admin/*, POST /stations-registry and /cache/*. Must match the
      # dashboard's ADMIN_API_KEY.
      - key: ADMIN_API_KEY
        sync: false

      # Comma-separated list of allowed CORS origins (your frontend URL)
      # Example: https://your-app.vercel.app,https://awh-dashboard.onrender.com
      - key: CORS_EXTRA_ORIGINS
        sync: false

      # Redis connection (optional — omit if not using Redis)
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
